name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build, vet, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: |
            **/go.sum

      - run: make build
      - run: make vet
      - run: make test

  e2e:
    name: E2E (docker compose)
    runs-on: ubuntu-latest
    needs: test
    env:
      JWT_SECRET: ci-secret
      # Empty on pull requests from forks; the AI chat may not work without it.
      GIGACHAT_AUTHORIZATION_KEY: ${{ secrets.GIGACHAT_AUTHORIZATION_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: |
            **/go.sum

      - name: Start the stack
        run: docker compose up --build -d --wait

      - name: Wait for the API gateway
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/profile/ || true)
            if [ "$code" = "401" ]; then
              echo "gateway is up"
              exit 0
            fi
            sleep 2
          done
          echo "gateway did not become ready"
          exit 1

      - name: Run e2e tests
        run: make e2e

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v
