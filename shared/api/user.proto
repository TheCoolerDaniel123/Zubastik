syntax = "proto3";

package pb;

option go_package = "shared/api/pb;api";

service UserService {
    rpc CreateUser (CreateUserRequest) returns (CreateUserResponse);
}

message CreateUserRequest {
    string uuid = 1;
    string phone = 2;
    int32 role = 3;
}

message CreateUserResponse {
    bool ok = 1;
    string error_message = 2;
}