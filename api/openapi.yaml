openapi: 3.0.3
info:
  title: Zub Dental Health API
  description: |
    API for the Zub dental health platform. All requests go through the API Gateway at `http://localhost:8080`.
 
    ## Authentication
    1. Call `POST /api/v1/auth/send_code` with a phone number in E.164 format (e.g. `+79991234567`)
    2. No SMS is sent in this build: the OTP code is always `1234`
    3. Call `POST /api/v1/auth/verify_code` to receive `access_token` + `refresh_token`
    4. Pass `Authorization: Bearer <access_token>` on all profile endpoints
    5. Use `POST /api/v1/auth/refresh_token` to renew the access token before it expires (15 min TTL)
  version: 1.0.0
 
servers:
  - url: http://localhost:8080
    description: Local Docker environment
 
tags:
  - name: Auth
    description: Phone OTP authentication and token management
  - name: Profile
    description: User profile and dental data (JWT required)
  - name: Chat
    description: AI-powered dental health assistant (JWT required)
  - name: Doctor
    description: Doctor endpoints (JWT required, role=doctor)
  - name: Lectures
    description: Articles/lectures — three access levels (JWT required)
  - name: Calendar
    description: Personal calendar events (JWT required)
  - name: Doctors
    description: List of doctors (JWT required)
 
paths:
  /api/v1/auth/send_code:
    post:
      tags: [Auth]
      summary: Send OTP code
      description: |
        Sends a 4-digit OTP to the given phone number.
        In this build the OTP code is always **`1234`**.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [Phone]
              properties:
                Phone:
                  type: string
                  description: Phone number in E.164 format
                  example: "+79991234567"
      responses:
        "200":
          description: Code sent successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
 
  /api/v1/auth/verify_code:
    post:
      tags: [Auth]
      summary: Verify OTP and get tokens
      description: |
        Verifies the OTP. On success returns a JWT token pair.
        `is_new_user` is `true` on the very first login, `false` on subsequent ones.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyCodeRequest"
      responses:
        "200":
          description: OTP verified, tokens issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyCodeResponse"
        "400":
          description: Validation error (invalid phone format or code length)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Wrong OTP code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
 
  /api/v1/auth/refresh_token:
    post:
      tags: [Auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenPair"
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          description: Invalid or expired tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
 
  /api/v1/profile/:
    get:
      tags: [Profile]
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile with teeth and brushing schedule
          content:
            application/json:
              schema:
